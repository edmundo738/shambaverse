version: '3.8'

services:
  web:
    build:
      context: ../frontend/web
      dockerfile: ../../docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - REACT_APP_FIREBASE_CONFIG=${FIREBASE_CONFIG}
    depends_on:
      - api

  api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://shambauser:${DB_PASSWORD}@postgres:5432/shambadb
      - REDIS_URL=redis://redis:6379
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - redis
      - ml-service

  ml-service:
    build:
      context: ../ml-service
      dockerfile: ../docker/Dockerfile.ml
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://shambauser:${DB_PASSWORD}@postgres:5432/shambadb

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=shambauser
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=shambadb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  firebase-emulator:
    build:
      context: ../firebase
      dockerfile: ../docker/Dockerfile.firebase
    ports:
      - "4000:4000"
      - "8080:8080"
      - "9000:9000"
      - "5001:5001"

volumes:
  postgres_data:
  redis_data:
